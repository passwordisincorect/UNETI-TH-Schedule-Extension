name: Staged GitHub releases v1.3-v1.5

on:
  push:
    paths:
      - '.github/release-trigger-v1.3-v1.5'

permissions:
  contents: write

concurrency:
  group: staged-releases-v1.3-v1.5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish v1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="1.3.0"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/blobs/38c08e3e6fe2260b53b92fec48bb76fb0a5e6644" --jq '.content' |
              tr -d '\n' |
              base64 --decode > "UNETI_TH_Schedule_Extension_v$VERSION.zip"
            gh release create "$TAG" "UNETI_TH_Schedule_Extension_v$VERSION.zip" --target "9482d561a9a7da7dba81226ea0656ff2d6730ee0" --title "$TAG" --notes "Bản v1.3.0: thêm lịch thực hành vào lịch tuần UNETI với nền xanh lá nhạt."
          fi

      - name: Wait 10 minutes before v1.4.0
        shell: bash
        run: sleep 600

      - name: Publish v1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="1.4.0"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/blobs/41be933b28a7933bd38b82e5819d3dcaa31b7f54" --jq '.content' |
              tr -d '\n' |
              base64 --decode > "UNETI_TH_Schedule_Extension_v$VERSION.zip"
            gh release create "$TAG" "UNETI_TH_Schedule_Extension_v$VERSION.zip" --target "3b91caf020431775f14b960995915036a104e480" --title "$TAG" --notes "Bản v1.4.0: sửa lỗi lịch thực hành biến mất khi chuyển tuần."
          fi

      - name: Wait 10 minutes before v1.5.0
        shell: bash
        run: sleep 600

      - name: Promote v1.5.0 source to main
        shell: bash
        run: |
          git fetch origin release/v1.5.0
          git checkout origin/release/v1.5.0 -- README.md content.js manifest.json styles.css
          git rm -f week-watcher.js
          git rm -f .github/workflows/staged-releases.yml
          git rm -f .github/release-trigger-v1.3-v1.5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md content.js manifest.json styles.css
          git commit -m "Release v1.5.0"
          git push origin HEAD:main
          echo "V15_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish v1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="1.5.0"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/blobs/c878696d286ba7d8d47f475eebd3cffd8f006e77" --jq '.content' |
              tr -d '\n' |
              base64 --decode > "UNETI_TH_Schedule_Extension_v$VERSION.zip"
            gh release create "$TAG" "UNETI_TH_Schedule_Extension_v$VERSION.zip" --target "$V15_TARGET" --title "$TAG" --notes "Bản v1.5.0: chọn thứ và tiết bằng danh sách, xác nhận một lần, tự lưu và tự khôi phục lịch khi đổi tuần."
          fi
