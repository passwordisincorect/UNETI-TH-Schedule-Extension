name: Staged GitHub releases v1.3-v1.5

on:
  schedule:
    - cron: '30 16 11 9 *'
    - cron: '40 16 11 9 *'
    - cron: '50 16 11 9 *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check one-time release window
        shell: bash
        run: |
          if [[ "$(date -u +%Y)" != "2026" ]]; then
            echo "This one-time release window has expired."
            exit 0
          fi

      - name: Select release
        id: release
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "30 16 11 9 *")
              echo "version=1.3.0" >> "$GITHUB_OUTPUT"
              echo "target=9482d561a9a7da7dba81226ea0656ff2d6730ee0" >> "$GITHUB_OUTPUT"
              echo "blob=38c08e3e6fe2260b53b92fec48bb76fb0a5e6644" >> "$GITHUB_OUTPUT"
              echo "notes=Bản v1.3.0: thêm lịch thực hành vào lịch tuần UNETI với nền xanh lá nhạt." >> "$GITHUB_OUTPUT"
              ;;
            "40 16 11 9 *")
              echo "version=1.4.0" >> "$GITHUB_OUTPUT"
              echo "target=3b91caf020431775f14b960995915036a104e480" >> "$GITHUB_OUTPUT"
              echo "blob=41be933b28a7933bd38b82e5819d3dcaa31b7f54" >> "$GITHUB_OUTPUT"
              echo "notes=Bản v1.4.0: sửa lỗi lịch thực hành biến mất khi chuyển tuần." >> "$GITHUB_OUTPUT"
              ;;
            "50 16 11 9 *")
              echo "version=1.5.0" >> "$GITHUB_OUTPUT"
              echo "target=pending" >> "$GITHUB_OUTPUT"
              echo "blob=c878696d286ba7d8d47f475eebd3cffd8f006e77" >> "$GITHUB_OUTPUT"
              echo "notes=Bản v1.5.0: chọn thứ và tiết bằng danh sách, xác nhận một lần, tự lưu và tự khôi phục lịch khi đổi tuần." >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown schedule: ${{ github.event.schedule }}"
              exit 1
              ;;
          esac

      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote v1.5.0 source to main
        if: steps.release.outputs.version == '1.5.0'
        shell: bash
        run: |
          git fetch origin release/v1.5.0
          git checkout origin/release/v1.5.0 -- README.md content.js manifest.json styles.css
          git rm -f week-watcher.js
          git rm -f .github/workflows/staged-releases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md content.js manifest.json styles.css
          git commit -m "Release v1.5.0"
          git push origin HEAD:main
          echo "V15_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download exact release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_BLOB: ${{ steps.release.outputs.blob }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/git/blobs/$ASSET_BLOB" --jq '.content' |
            tr -d '\n' |
            base64 --decode > "UNETI_TH_Schedule_Extension_v$VERSION.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          FIXED_TARGET: ${{ steps.release.outputs.target }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          TARGET="$FIXED_TARGET"
          if [[ "$VERSION" == "1.5.0" ]]; then
            TARGET="$V15_TARGET"
          fi
          gh release create "$TAG"             "UNETI_TH_Schedule_Extension_v$VERSION.zip"             --target "$TARGET"             --title "$TAG"             --notes "$NOTES"
